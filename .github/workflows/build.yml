name: Build Chocolatey Package

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.38.0
  workflow_dispatch:  # Allow manual triggering

env:
  PACKAGE_NAME: granted

jobs:
  build:
    runs-on: windows-latest
    outputs:
      package_file: ${{ steps.build.outputs.package_file }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Extract version from tag
      id: version
      shell: powershell
      run: |
        if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
          $version = $matches[1]
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Extracted version: $version"
        } else {
          Write-Error "Could not extract version from ref: $env:GITHUB_REF"
          exit 1
        }
    
    - name: Update package version in nuspec
      shell: powershell
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $nuspecPath = "granted.nuspec"
        
        # Read and update nuspec file
        $content = Get-Content $nuspecPath -Raw
        $content = $content -replace '<version>[\d\.]+</version>', "<version>$version</version>"
        $content = $content -replace '/v[\d\.]+/', "/v$version/"
        Set-Content $nuspecPath $content
        
        Write-Host "Updated nuspec version to: $version"
        
    - name: Update version in install script
      shell: powershell
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $installScriptPath = "tools/chocolateyInstall.ps1"
        
        # Read and update install script
        $content = Get-Content $installScriptPath -Raw
        $content = $content -replace '\$version = ''[\d\.]+''', "`$version = '$version'"
        Set-Content $installScriptPath $content
        
        Write-Host "Updated install script version to: $version"
        
    - name: Verify upstream release exists
      shell: powershell
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $baseUrl = "https://github.com/fwdcloudsec/granted/releases/download/v$version"
        
        # Check if x86_64 version exists (most common)
        $testUrl = "$baseUrl/granted_${version}_windows_x86_64.zip"
        
        try {
          $response = Invoke-WebRequest -Uri $testUrl -Method Head -ErrorAction Stop
          Write-Host "✅ Upstream release found: $testUrl"
        } catch {
          Write-Error "❌ Upstream release not found: $testUrl"
          Write-Error "Please ensure Granted CLI v$version is released before creating this tag"
          exit 1
        }
        
    - name: Install Chocolatey
      shell: powershell
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        
    - name: Build Chocolatey package
      shell: powershell
      run: |
        # Build the package
        choco pack granted.nuspec
        
        # Verify package was created
        $packageFile = Get-ChildItem -Name "*.nupkg" | Select-Object -First 1
        if ($packageFile) {
          Write-Host "✅ Package built successfully: $packageFile"
          Write-Output "package_file=$packageFile" >> $env:GITHUB_OUTPUT
        } else {
          Write-Error "❌ No package file found"
          exit 1
        }
      id: build
      
    - name: Test package installation
      shell: powershell
      run: |
        $packageFile = "${{ steps.build.outputs.package_file }}"
        $version = "${{ steps.version.outputs.version }}"
        
        Write-Host "Testing package installation..."
        choco install granted --version="$version" --source="." -f -y
        
        # Test if granted command is available
        try {
          $output = granted --version
          Write-Host "✅ Package installed successfully. Output: $output"
        } catch {
          Write-Error "❌ Package installation test failed"
          exit 1
        }
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: "Chocolatey Package v${{ steps.version.outputs.version }}"
        body: |
          ## Chocolatey Package for Granted CLI v${{ steps.version.outputs.version }}
          
          ### Installation
          ```powershell
          choco install granted
          ```
          
          ### Upgrade
          ```powershell
          choco upgrade granted
          ```
          
          ### What's New
          This package tracks [Granted CLI v${{ steps.version.outputs.version }}](https://github.com/fwdcloudsec/granted/releases/tag/v${{ steps.version.outputs.version }}).
          
          ### Supported Architectures
          - ✅ x64 (AMD64)
          - ✅ x86 (32-bit)
          - ✅ ARM64
          
          ### Files
          - `${{ steps.build.outputs.package_file }}` - Chocolatey package file
          
          ### Notes
          - Auto-detects system architecture
          - Installs appropriate Granted CLI binary
          - Adds `granted` to system PATH
        files: |
          *.nupkg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Display completion message
      shell: powershell
      run: |
        Write-Host ""
        Write-Host "🎉 Build completed successfully!" -ForegroundColor Green
        Write-Host ""
        Write-Host "📦 Package: ${{ steps.build.outputs.package_file }}" -ForegroundColor Cyan
        Write-Host "🏷️  Version: ${{ steps.version.outputs.version }}" -ForegroundColor Cyan
        Write-Host "🔗 Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}" -ForegroundColor Cyan
        Write-Host ""
        Write-Host "Users can now install with:" -ForegroundColor Yellow
        Write-Host "  choco install granted" -ForegroundColor White
        
    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: chocolatey-package
        path: "*.nupkg"
        retention-days: 30

  publish:
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: chocolatey-publish  # Protect production deployments
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download package artifact
      uses: actions/download-artifact@v4
      with:
        name: chocolatey-package
        path: ./
      continue-on-error: true  # In case artifacts aren't available yet
        
    - name: Get package file from build job
      shell: powershell
      run: |
        # If artifact download failed, rebuild package quickly
        if (-not (Test-Path "*.nupkg")) {
          Write-Host "Package file not found, rebuilding..."
          
          # Install Chocolatey
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          
          # Update version in files (same as build job)
          $version = "${{ needs.build.outputs.version }}"
          
          $nuspecPath = "granted.nuspec"
          $content = Get-Content $nuspecPath -Raw
          $content = $content -replace '<version>[\d\.]+</version>', "<version>$version</version>"
          $content = $content -replace '/v[\d\.]+/', "/v$version/"
          Set-Content $nuspecPath $content
          
          $installScriptPath = "tools/chocolateyInstall.ps1"
          $content = Get-Content $installScriptPath -Raw
          $content = $content -replace '\$version = ''[\d\.]+''', "`$version = '$version'"
          Set-Content $installScriptPath $content
          
          choco pack granted.nuspec
        }
        
        $packageFile = Get-ChildItem -Name "*.nupkg" | Select-Object -First 1
        Write-Host "Package file: $packageFile"
        Write-Output "package_file=$packageFile" >> $env:GITHUB_OUTPUT
      id: package
    
    - name: Validate package before publishing
      shell: powershell
      run: |
        $packageFile = "${{ steps.package.outputs.package_file }}"
        
        Write-Host "Validating package: $packageFile"
        
        # Check package exists and has reasonable size
        if (-not (Test-Path $packageFile)) {
          Write-Error "Package file not found: $packageFile"
          exit 1
        }
        
        $fileInfo = Get-Item $packageFile
        if ($fileInfo.Length -lt 1KB) {
          Write-Error "Package file is too small: $($fileInfo.Length) bytes"
          exit 1
        }
        
        Write-Host "✅ Package validation passed: $($fileInfo.Length) bytes"
        
    - name: Publish to Chocolatey.org
      shell: powershell
      run: |
        $packageFile = "${{ steps.package.outputs.package_file }}"
        $apiKey = "${{ secrets.CHOCOLATEY_API_KEY }}"
        
        if (-not $apiKey) {
          Write-Warning "⚠️  CHOCOLATEY_API_KEY not set. Skipping publication to chocolatey.org"
          Write-Host "To enable automatic publication:"
          Write-Host "1. Get API key from https://community.chocolatey.org/account"
          Write-Host "2. Add it as repository secret CHOCOLATEY_API_KEY"
          exit 0
        }
        
        Write-Host "Publishing $packageFile to chocolatey.org..."
        
        # Set API key
        choco apikey -k $apiKey -source https://push.chocolatey.org/
        
        # Push package
        try {
          choco push $packageFile --source https://push.chocolatey.org/
          Write-Host "✅ Package published successfully to chocolatey.org!"
          Write-Host ""
          Write-Host "🎉 Users can now install with:"
          Write-Host "   choco install granted"
          Write-Host ""
          Write-Host "📦 Package page: https://community.chocolatey.org/packages/granted"
        } catch {
          Write-Error "❌ Failed to publish package: $($_.Exception.Message)"
          Write-Host ""
          Write-Host "Common issues:"
          Write-Host "- Invalid API key"
          Write-Host "- Package already exists with this version"
          Write-Host "- Package validation failed on chocolatey.org"
          Write-Host "- Network connectivity issues"
          exit 1
        }
        
    - name: Create publication summary
      shell: powershell
      run: |
        Write-Host ""
        Write-Host "🎊 PUBLICATION COMPLETE! 🎊" -ForegroundColor Green
        Write-Host "================================" -ForegroundColor Green
        Write-Host ""
        Write-Host "📦 Package: ${{ steps.package.outputs.package_file }}" -ForegroundColor Cyan
        Write-Host "🏷️  Version: ${{ needs.build.outputs.version }}" -ForegroundColor Cyan
        Write-Host "🔗 GitHub: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}" -ForegroundColor Cyan
        Write-Host "🍫 Chocolatey: https://community.chocolatey.org/packages/granted" -ForegroundColor Cyan
        Write-Host ""
        Write-Host "Users worldwide can now install with:" -ForegroundColor Yellow
        Write-Host "  choco install granted" -ForegroundColor White
        Write-Host "" 